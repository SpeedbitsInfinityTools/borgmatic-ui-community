version: '3.8'

# Borgmatic-UI Professional Installation
# Includes UI + Fresh Borgmatic Engine

services:
  # Borgmatic Engine - Fresh installation for UI management
  borgmatic-engine:
    image: ghcr.io/borgmatic-collective/borgmatic:latest
    container_name: borgmatic-ui-engine
    restart: unless-stopped
    environment:
      TZ: "${TZ:-UTC}"
      PUID: 0
      PGID: 0
      # Passphrase managed by UI
      BORG_PASSCOMMAND: "cat /etc/borgmatic/repo-passphrase.txt"
    volumes:
      # UI-managed configurations
      - /opt/speedbits/borgmatic-ui-engine/config:/etc/borgmatic.d
      - /opt/speedbits/borgmatic-ui-engine/repo-passphrase.txt:/etc/borgmatic/repo-passphrase.txt:ro
      
      # Backup repositories
      - /opt/speedbits/borgmatic-ui-engine/repositories:/backups
      
      # Host filesystem access (available at /host)
      # Borg can backup sources from /host/... and create repos at /host/...
      - /:/host:rw
      
      # Docker socket for database detection
      - /var/run/docker.sock:/var/run/docker.sock:ro
      
      # SSH keys for remote repositories
      - ${HOME}/.ssh:/root/.ssh:ro
    networks:
      - borgmatic-ui-network
      - borgmatic-db
    command:
      - /bin/sh
      - -c
      - |
        echo "Borgmatic Engine ready for UI management"
        # Start cron daemon for scheduled backups
        crond -f

  # Borgmatic-UI Web Interface
  borgmatic-ui:
    # Choose edition: community or commercial
    # Community: Free edition without Director mode
    # Commercial: Full edition with Director mode for managing multiple clients
    image: ghcr.io/smartinventure/speedbits-borgmatic-ui:latest-${EDITION:-commercial}
    container_name: borgmatic-ui-web
    restart: unless-stopped
    ports:
      - "${UI_PORT:-8000}:8000"
      - "${DIRECTOR_PORT:-9000}:9000"
    environment:
      # Secret key (auto-generated on first start)
      SECRET_KEY: "${SECRET_KEY:-}"
      
      # Admin password for first login (optional - can also set via UI)
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      
      # API Key for automated tools like Infinity Tools (optional)
      # If set, allows X-API-Key header authentication without login
      INFINITY_TOOLS_API_KEY: "${INFINITY_TOOLS_API_KEY:-}"
      
      # ============================================================
      # OPERATING MODE - Set this to auto-configure on first start
      # ============================================================
      # Options:
      #   standalone - Local backup management only (default)
      #   client     - Can connect to a Director for remote management
      #   director   - Central management server (Commercial edition only)
      #
      # When set, the container auto-creates mode.json on first startup
      # and uses mode-specific data paths:
      #   standalone/client: /opt/speedbits/borgmatic-ui-client/
      #   director:          /opt/speedbits/borgmatic-ui-director/
      # ============================================================
      BORGMATIC_MODE: "${BORGMATIC_MODE:-standalone}"
      
      # Borgmatic engine connection
      BORGMATIC_CONTAINER: "borgmatic-ui-engine"
      
      # Node environment
      NODE_ENV: "production"
      PORT: "8000"
      
      # Timezone
      TZ: "${TZ:-UTC}"
      
      # Redis cache (optional but recommended for Borg 1.x archive browsing performance)
      # Uses the service name `redis` on the compose network.
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    volumes:
      # UI application data
      # NOTE: Infinity Tools will configure these paths based on mode:
      # - Client/Standalone: /opt/speedbits/borgmatic-ui-client/{data,config,logs}
      # - Director:          /opt/speedbits/borgmatic-ui-director/{data,config,logs}
      - /opt/speedbits/borgmatic-ui-web/data:/app/data
      - /opt/speedbits/borgmatic-ui-web/config:/app/config
      - /opt/speedbits/borgmatic-ui-web/logs:/app/logs
      
      # Docker socket to control borgmatic-engine
      - /var/run/docker.sock:/var/run/docker.sock
      
      # Read-only: Backup repositories (for browsing archives)
      - /opt/speedbits/borgmatic-ui-engine/repositories:/backups:ro
      
      # Host filesystem access for browsing (available at /host inside container)
      # Users can browse and select paths like /host/opt/backups
      # Only directories the container user can read will be visible
      - /:/host:rw
    networks:
      - borgmatic-ui-network
      - borgmatic-db
    depends_on:
      - borgmatic-engine
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis - Archive Listing Cache (recommended for Borg 1.x depth simulation)
  redis:
    image: redis:7-alpine
    container_name: borgmatic-ui-redis
    restart: unless-stopped
    command: redis-server --maxmemory 100mb --maxmemory-policy allkeys-lru --save 60 1
    volumes:
      - borgmatic_ui_redis_data:/data
    networks:
      - borgmatic-ui-network

networks:
  borgmatic-ui-network:
    driver: bridge
  borgmatic-db:
    external: true
    # Will be created by install script if not exists

volumes:
  borgmatic_ui_redis_data:
    name: borgmatic-ui-redis-data
